let st=JSON.parse(localStorage.getItem("rzFullV2")||'{"coins":0,"owned":{},"rewarded":{},"wish":{},"custom":[],"inventory":[],"room":[],"roomRider":"","riderImages":{}}');
if(!st.riderImages)st.riderImages={};const $=s=>document.querySelector(s),save=()=>{localStorage.setItem("rzFullV2",JSON.stringify(st));$("#coins").textContent=st.coins},key=(r,i)=>r.id+"::"+i,all=()=>riders.concat(st.custom),get=id=>all().find(r=>r.id===id);function riderVisual(r){if(!r)return "";const src=st.riderImages[r.id];return src?'<img class="roomimg" style="--c:'+r.color+'" src="'+src+'" alt="'+r.name+'の画像">':'<div class="roommark" style="--c:'+r.color+'">画像未設定</div>'}function saveRiderImage(file,r){if(!file||!r)return;const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement("canvas"),size=320;c.width=size;c.height=size;const ctx=c.getContext("2d"),s=Math.min(img.width,img.height),sx=(img.width-s)/2,sy=(img.height-s)/2;ctx.drawImage(img,sx,sy,s,s,0,0,size,size);st.riderImages[r.id]=c.toDataURL("image/jpeg",0.82);save();home()};img.src=reader.result};reader.readAsDataURL(file)}
let tab=1,era="全部",rid="",want=false,invKind="家具";
function setTab(n){tab=n;document.querySelectorAll(".tabs button").forEach((b,i)=>b.classList.toggle("active",i===n));[home,zukan,belt,create,shop,quotes][n]()}
document.querySelectorAll(".tabs button").forEach((b,i)=>b.onclick=()=>setTab(i));
function home(){const r=get(st.roomRider),opts=['<option value="">ライダー未選択</option>','<option value="all">全ライダー</option>',...all().map(x=>'<option value="'+x.id+'" '+(st.roomRider===x.id?'selected':'')+'>'+x.name+'</option>')].join("");const visual=st.roomRider==="all"?'<div><div class="roommark" style="--c:#18212b">ALL</div><b>全ライダー</b></div>':r?'<div>'+riderVisual(r)+'<b>'+r.name+'</b></div>':'<b>ライダー未選択</b>';const picker=r?'<div class="imgpick"><label class="sub">ライダー画像を設定</label><input id="riderImage" type="file" accept="image/*"><div class="sub">画像はこの端末の中だけに保存し、GitHubやNetlifyにはアップロードしません。</div></div>':'';const available=st.inventory.filter(x=>x.kind===invKind&&!st.room.some(p=>p.uid===x.uid));$("#screen").innerHTML='<div class="panel stack"><b style="font-size:20px">マイルーム</b><div class="sub">好きなライダーを1人表示。家具・飾りは最大10個。</div><select id="roomsel" class="control">'+opts+'</select><div id="roomArea" class="room"><div class="roomcenter">'+visual+'</div>'+st.room.map((o,i)=>'<div class="roomobj" data-i="'+i+'" style="left:'+o.x+'%;top:'+o.y+'%;transform:scaleX('+(o.dir||1)+')"><div class="objicon">'+(o.icon||"◼")+'</div><div class="objname">'+o.name+'</div><div class="objactions"><button class="turn" data-i="'+i+'">向き</button><button class="away" data-i="'+i+'">片づけ</button></div></div>').join("")+'</div>'+picker+'<div class="filters">'+["家具","ポスター","マーク"].map(k=>'<button class="pill '+(invKind===k?'active':'')+'" data-k="'+k+'">'+k+'</button>').join("")+'</div><div class="invgrid">'+(available.length?available.map(x=>'<div class="shop"><b>'+x.name+'</b><div class="sub">'+x.kind+'</div><button class="mini place" data-u="'+x.uid+'">部屋に置く</button></div>').join(""):'<div class="notice">この種類の持ち物はまだありません。ショップで買えます。</div>')+'</div><div class="notice">部屋に配置中 '+st.room.length+' / 10。置いた家具は指で動かせます。</div></div>';$("#roomsel").onchange=e=>{st.roomRider=e.target.value;save();home()};if(r&&$("#riderImage"))$("#riderImage").onchange=e=>saveRiderImage(e.target.files[0],r);document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{invKind=b.dataset.k;home()});document.querySelectorAll(".place").forEach(b=>b.onclick=()=>{if(st.room.length>=10)return alert("置けるのは10個までだよ。");const x=st.inventory.find(v=>v.uid===b.dataset.u);if(!x)return;st.room.push({...x,x:8+(st.room.length%3)*28,y:12+Math.floor(st.room.length/3)*24,dir:1});save();home()});document.querySelectorAll(".turn").forEach(b=>b.onclick=e=>{e.stopPropagation();st.room[+b.dataset.i].dir=(st.room[+b.dataset.i].dir||1)*-1;save();home()});document.querySelectorAll(".away").forEach(b=>b.onclick=e=>{e.stopPropagation();st.room.splice(+b.dataset.i,1);save();home()});document.querySelectorAll(".roomobj").forEach(el=>{let sx,sy,ox,oy;el.addEventListener("pointerdown",e=>{if(e.target.tagName==="BUTTON")return;el.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;const p=st.room[+el.dataset.i];ox=p.x;oy=p.y});el.addEventListener("pointermove",e=>{if(!el.hasPointerCapture(e.pointerId))return;const rect=$("#roomArea").getBoundingClientRect(),p=st.room[+el.dataset.i];p.x=Math.max(0,Math.min(78,ox+(e.clientX-sx)/rect.width*100));p.y=Math.max(0,Math.min(78,oy+(e.clientY-sy)/rect.height*100));el.style.left=p.x+"%";el.style.top=p.y+"%"});el.addEventListener("pointerup",e=>{if(el.hasPointerCapture(e.pointerId))el.releasePointerCapture(e.pointerId);save()})})}
function zukan(){if(rid){riderPage();return}const q="";const rs=all().filter(r=>era==="全部"||r.era===era);$("#screen").innerHTML='<div class="panel stack"><b style="font-size:20px">図鑑</b><div class="sub">持っている物はカラー、持っていない物は灰色。ライダーごとのイメージカラーで表示。</div><input id="q" class="control" placeholder="ライダー名・アイテム名を検索"><div class="filters">'+["全部","昭和","平成","令和"].map(e=>'<button class="pill '+(era===e?'active':'')+'" data-e="'+e+'">'+e+'</button>').join("")+'<button id="want" class="pill '+(want?'active':'')+'">欲しい物だけ</button></div><div id="rgrid" class="grid">'+cards(rs)+'</div></div>';document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{era=b.dataset.e;zukan()});$("#want").onclick=()=>{want=!want;zukan()};$("#q").oninput=e=>{const v=e.target.value;$("#rgrid").innerHTML=cards(all().filter(r=>(era==="全部"||r.era===era)&&(r.name.includes(v)||r.items.some(x=>x.includes(v)))));bindCards()};bindCards()}
function cards(rs){return rs.map(r=>'<button class="rider" data-r="'+r.id+'" style="--c:'+r.color+'"><span class="mark">'+r.mark+'</span><b>'+r.name+'</b><div class="sub" style="margin-top:20px">'+r.era+'・所持 '+r.items.filter((_,i)=>st.owned[key(r,i)]).length+'/'+r.items.length+'</div></button>').join("")}
function bindCards(){document.querySelectorAll(".rider").forEach(b=>b.onclick=()=>{rid=b.dataset.r;riderPage()})}
function riderPage(){const r=get(rid);if(!r){rid="";zukan();return}const rows=r.items.map((name,i)=>({name,i,k:key(r,i)})).filter(x=>!want||st.wish[x.k]);$("#screen").innerHTML='<div class="stack"><button id="back" class="btn">← ライダー一覧</button><div class="panel" style="border:3px solid '+r.color+'"><span class="mark" style="--c:'+r.color+'">'+r.mark+'</span><b style="font-size:19px">'+r.name+'</b><div class="sub">全 '+r.items.length+' 件</div></div><button id="wp" class="pill '+(want?'active':'')+'">欲しい物だけ</button><div class="grid">'+rows.map(x=>'<div class="item '+(st.owned[x.k]?'owned':'')+'" style="--c:'+r.color+'"><b>'+x.name+'</b><div class="sub">'+(st.owned[x.k]?'所持':'未所持')+(st.wish[x.k]?'・★ 欲しい':'')+'</div><div class="actions"><button class="mini wish '+(st.wish[x.k]?'on':'')+'" data-k="'+x.k+'">★</button><button class="mini own" data-k="'+x.k+'">'+(st.owned[x.k]?'登録取消':'写真で登録')+'</button></div></div>').join("")+'</div></div>';$("#back").onclick=()=>{rid="";zukan()};$("#wp").onclick=()=>{want=!want;riderPage()};document.querySelectorAll(".wish").forEach(b=>b.onclick=()=>{st.wish[b.dataset.k]=!st.wish[b.dataset.k];save();riderPage()});document.querySelectorAll(".own").forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(st.owned[k])delete st.owned[k];else if(confirm("写真で確認して『持っている』に登録しますか？\n試作版では写真自体は保存しません。")){st.owned[k]=1;if(!st.rewarded[k]){st.rewarded[k]=1;st.coins+=5}}save();riderPage()})}
function belt(){const owned=[];all().forEach(r=>r.items.forEach((x,i)=>{if(st.owned[key(r,i)])owned.push({r,x})}));$("#screen").innerHTML='<div class="panel stack"><b style="font-size:20px">ベルト</b><div class="sub">登録したアイテムをセットして遊ぶ試作です。</div><select id="br" class="control"><option value="">使うライダーを選択</option><option value="all">全ライダー</option>'+all().map(r=>'<option value="'+r.id+'">'+r.name+'</option>').join("")+'</select><div class="room"><b>BELT</b></div><div id="bm" class="notice">ライダーを選んでね。</div><div class="grid">'+(owned.length?owned.map(o=>'<div class="item owned" style="--c:'+o.r.color+'"><b>'+o.x+'</b><div class="sub">'+o.r.name+'</div><button class="mini sb" data-r="'+o.r.id+'" data-n="'+o.x+'">セット</button></div>').join(""):'<div class="notice">図鑑で所持登録するとここに出ます。</div>')+'</div></div>';document.querySelectorAll(".sb").forEach(b=>b.onclick=()=>{const v=$("#br").value;if(!v){$("#bm").textContent="先にライダーを選んでね。";return}if(v==="all"||v===b.dataset.r)$("#bm").textContent=b.dataset.n+" セット！ 変身演出（試作）";else $("#bm").textContent="これは "+get(b.dataset.r).name+" に使ってね。"})}
function create(){ $("#screen").innerHTML='<div class="panel stack"><b style="font-size:20px">自作アイテム</b><input id="cn" class="control" placeholder="アイテム名"><select id="cr" class="control"><option value="">使うライダーを選択</option><option value="all">全ライダー</option>'+all().map(r=>'<option value="'+r.id+'">'+r.name+'</option>').join("")+'</select><button id="add" class="pill active">作る</button><div id="cm" class="notice">まだ作っていません。</div></div>';$("#add").onclick=()=>{const n=$("#cn").value.trim(),v=$("#cr").value;if(!n||!v){$("#cm").textContent="名前とライダーを選んでね。";return}if(v==="all"){let r=st.custom.find(x=>x.id==="custom-all");if(!r){r={id:"custom-all",era:"自作",name:"全ライダー対応・自作",mark:"ALL",color:"#555",items:[]};st.custom.push(r)}r.items.push(n)}else get(v).items.push(n);save();$("#cm").textContent=n+" を追加したよ。"}}
const goods=[["ベッド","家具",15,"🛏️"],["机","家具",10,"🪵"],["椅子","家具",8,"🪑"],["ライダーランプ","家具",10,"💡"],["コレクション棚","家具",15,"🗄️"],["映画ポスター","ポスター",10,"🎞️"],["ライダーマーク","マーク",5,"🔰"]];
function shop(){ $("#screen").innerHTML='<div class="panel stack"><b style="font-size:20px">ショップ</b><div class="sub">初めて所持登録すると5コイン。買った物は売れません。</div><div class="grid">'+goods.map((g,i)=>'<div class="shop"><b>'+g[0]+'</b><div class="sub">'+g[1]+'</div><p>'+g[2]+'コイン</p><button class="mini buy" data-i="'+i+'">買う</button></div>').join("")+'</div></div>';document.querySelectorAll(".buy").forEach(b=>b.onclick=()=>{const g=goods[+b.dataset.i];if(st.coins<g[2])return alert("コインが足りないよ。");st.coins-=g[2];st.inventory.push({uid:"g"+Date.now()+Math.random(),name:g[0],kind:g[1],icon:g[3],dir:1});save();shop()})}
function heroVoice(r){try{const A=window.AudioContext||window.webkitAudioContext;if(A){const c=new A(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=180;g.gain.value=.035;o.start();o.stop(c.currentTime+.12)}}catch(e){}if(!("speechSynthesis" in window))return alert("この端末では音声再生に対応していません。");speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(r.name+"。ここからが勝負だ！");u.lang="ja-JP";u.rate=.86;u.pitch=.72;u.volume=1;speechSynthesis.speak(u)}
function quotes(){ $("#screen").innerHTML='<div class="panel stack"><b style="font-size:20px">名言</b><div class="sub">そのライダーのアイテムを5個集めると解放。再生するとオリジナルのヒーロー風ボイスが流れます。</div>'+all().map(r=>{const owned=r.items.filter((_,i)=>st.owned[key(r,i)]).length,ok=owned>=5;return '<div class="quote" style="border-color:'+(ok?r.color:'#c5ced6')+'"><div><b>'+r.name+'</b><div class="sub">'+(ok?'解放済み':owned+' / 5 個')+'</div></div><button class="mini qplay" data-r="'+r.id+'" '+(ok?'':'disabled')+'>'+(ok?'再生':'5個で解放')+'</button></div>'}).join("")+'<div class="notice">本編の俳優・キャラクター音声ではなく、端末の読み上げ機能を使ったオリジナルのヒーロー風ボイスです。</div></div>';document.querySelectorAll(".qplay").forEach(b=>b.onclick=()=>heroVoice(get(b.dataset.r)))}

save();setTab(1);if("serviceWorker" in navigator)navigator.serviceWorker.register("./service-worker.js");
</script></body></html>
